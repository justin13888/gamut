[package]
name = "gamut-iptc"
description = "IPTC photo metadata (legacy IIM + IPTC Photo Metadata Core/Extension over XMP) parser and serializer for gamut."
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
gamut-core.workspace = true
gamut-xmp.workspace = true

[dev-dependencies]
# Differential oracle: a vendored, statically-linked exiv2 (the reference for legacy IPTC-IIM/IRB).
# Dev-only and excluded from the workspace, so a plain build of gamut-iptc needs no C++ toolchain;
# the cross-check tests need the third_party/exiv2 submodule + CMake/Ninja. See its manifest.
gamut-iptc-oracle = { path = "../../tooling/gamut-iptc-oracle" }
# Reads the vendored IPTC machine-readable tech reference in tests/techreference.rs, pinning the
# hand-transcribed schema/tag tables to the spec.
serde_json.workspace = true
