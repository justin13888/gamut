# cbindgen configuration for the committed C header (include/gamut.h).
#
# Plain (non-expanding) parse on the pinned stable toolchain — deliberately no [parse.expand],
# which would tie header generation to an unpinned nightly. The `#[unsafe(no_mangle)]
# extern "C"` wrappers are handwritten in the format modules precisely so this parse sees them
# (the macro-stamped internals const-pin each wrapper, so the two cannot drift). Regenerate
# with `mise run gen-ffi-header`; CI diffs via `mise run check-ffi-header`.

language = "C"
include_guard = "GAMUT_H"
autogen_warning = "/* Generated by cbindgen from gamut-ffi — do not edit; run `mise run gen-ffi-header`. */"
documentation = true
cpp_compat = true
usize_is_size_t = true

[parse]
parse_deps = true
# The provider-boundary seam types (vtables, descriptors, Status, WriteFn) come from the one
# sanctioned seam crate — never a parallel convention in this crate.
include = ["gamut-codec-abi"]

[export]
# MAX_PLANES sizes the ImageDesc plane arrays; it is not referenced by a wrapper signature, so
# force its emission.
include = ["MAX_PLANES"]

[export.rename]
"MAX_PLANES" = "GAMUT_MAX_PLANES"
# C-namespace the seam types (Rust names are crate-qualified; C has one namespace).
"DecoderVTable" = "GamutDecoderVTable"
"EncoderVTable" = "GamutEncoderVTable"
"StreamConfig" = "GamutStreamConfig"
"EncodeConfig" = "GamutEncodeConfig"
"ImageDesc" = "GamutImageDesc"
"Status" = "GamutAbiStatus"
"WriteFn" = "GamutWriteFn"
# The boundary status type keeps its C-idiomatic spelling.
"GamutStatus" = "gamut_status_t"
