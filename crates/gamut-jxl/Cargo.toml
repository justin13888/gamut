[package]
name = "gamut-jxl"
description = "JPEG XL image encoder and decoder."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
gamut-core.workspace = true

# The libjxl-backed encoder. Target-conditional optional dep (the `getrandom` pattern): on wasm32
# the native cmake/libjxl build is unavailable, so the dep — and therefore the whole encoder — is
# compiled out there, leaving the crate to grow a pure-Rust decoder for that target.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gamut-jxl-sys = { workspace = true, optional = true }

# The oracle for the encoder tests: the same static libjxl archive also exposes a decode surface,
# which the integration tests use to read encoded streams back. Unavailable on wasm32 for the same
# reason as the dep above.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
gamut-jxl-sys.workspace = true

[features]
default = ["encode"]
# Wraps the reference libjxl (via `gamut-jxl-sys`) to encode JPEG XL. On wasm32 the underlying
# target-conditional dep is absent, so enabling `encode` is inert there (it pulls in nothing and
# gates out the encoder modules) rather than a build error.
encode = ["dep:gamut-jxl-sys"]
# NB: the pure-Rust `decode` feature arrives with the decoder unit (wrapping the `jxl` crate); it is
# intentionally not declared yet so the feature never advertises an unimplemented surface.
